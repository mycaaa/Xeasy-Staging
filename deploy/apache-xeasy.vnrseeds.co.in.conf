# Apache vhost for the Xeasy TEST host. Copy to /etc/apache2/sites-available/, then:
#   a2enmod rewrite headers proxy_fcgi setenvif ssl && a2enconf php8.3-fpm   (use your PHP version)
#   a2ensite apache-xeasy.vnrseeds.co.in && systemctl reload apache2
#   certbot --apache -d xeasy.vnrseeds.co.in          (TLS certificate; adds the :443 block)
# Change /var/www/xeasy to the folder the repository was cloned into. Only public/ is served.
<VirtualHost *:80>
    ServerName xeasy.vnrseeds.co.in
    DocumentRoot /var/www/xeasy/public

    <Directory /var/www/xeasy/public>
        AllowOverride All
        Require all granted
        Options -Indexes -MultiViews +FollowSymLinks
    </Directory>

    # nothing outside public/ is reachable; block dot-files just in case
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # test host: keep it out of search engines
    Header always set X-Robots-Tag "noindex, nofollow"

    LimitRequestBody 26214400
    ErrorLog ${APACHE_LOG_DIR}/xeasy-error.log
    CustomLog ${APACHE_LOG_DIR}/xeasy-access.log combined
</VirtualHost>
