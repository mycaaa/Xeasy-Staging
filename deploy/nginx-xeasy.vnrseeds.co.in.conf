# nginx alternative to the Apache vhost. Copy to /etc/nginx/sites-available/, link into sites-enabled,
# nginx -t && systemctl reload nginx; then certbot --nginx -d xeasy.vnrseeds.co.in
server {
    listen 80;
    server_name xeasy.vnrseeds.co.in;
    root /var/www/xeasy/public;
    index index.php;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # speed: compressed text; versioned libraries cached a year, other libraries/images/fonts 7 days
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    location ~ ^/vendor/cdn/[^/]+@[^/]+/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~ ^/assets/(libs|images|fonts)/ { expires 7d; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }
    access_log /var/log/nginx/xeasy-access.log;
    error_log  /var/log/nginx/xeasy-error.log;
}
