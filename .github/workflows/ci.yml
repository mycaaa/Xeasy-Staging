# C-10: checks on every push and pull request. Read-only token, no secrets used, no deployment.
# (C-01: the only workflow ever added before was malicious; this one cannot read or send secrets.)
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: PHP syntax
        run: find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Blade raw output and SQL interpolation guard
        run: |
          # fail on new request input pasted into SQL or new {!! !!} on request data
          ! grep -rnE "(select|update|insert|delete|whereRaw|selectRaw)\s*\([^)]*\\\$request->(input|get)\(" app
          ! grep -rnE "\{!!\s*request\(" resources/views
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Tests
        run: php artisan test --without-tty || vendor/bin/phpunit
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # CI-GITLEAKS-01 (16 Nov 2026): the gitleaks GitHub Action now needs a licence, and failed when GitHub's API
      # rate limit stopped it checking the account type. The gitleaks program itself needs neither. Pinned version,
      # download checked against its SHA-256. Scans the commits of this push / pull request, as the action did.
      - name: Secret scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$SHA"
          else
            RANGE="$SHA~1..$SHA"
          fi
          echo "Scanning $RANGE"
          ./gitleaks detect --source . --redact --no-banner --log-opts="$RANGE"
